name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build launcher
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath '.\version.txt' -Raw).Trim()
          $expectedTag = "v$version"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match version.txt ($expectedTag)."
          }
          .\build.ps1 -Release -UpdateRepository "${{ github.repository }}"

      - name: Package release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -LiteralPath '.\dist\iRacing Teammate.exe', '.\dist\README.md' -DestinationPath ".\dist\iRacing-Teammate-$tag.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath ".\dist\iRacing-Teammate-$tag.zip").Hash.ToLowerInvariant()
          "$hash  iRacing-Teammate-$tag.zip" | Set-Content -LiteralPath ".\dist\iRacing-Teammate-$tag.zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag ".\dist\iRacing-Teammate-$tag.zip" ".\dist\iRacing-Teammate-$tag.zip.sha256" --generate-notes --title "iRacing Teammate $tag"
