name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What pre-race task should become easier?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible result.
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Related companion software
      placeholder: Optional
